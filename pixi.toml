[workspace]
name = "agentic-task-gen"
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[dependencies]
python = "3.12.*"
# conda-forge builds bundle OpenMP on macOS (the PyPI wheels need a system libomp)
lightgbm = ">=4.6"
xgboost = ">=3.4"
# rdblearn's torch pins, from conda-forge so that torch shares that OpenMP (PyPI torch bundles a second)
pytorch = "==2.7.1"
torchvision = "==0.22.1"
torchaudio = "==2.7.1"
# autogluon 1.5.0 (via rdblearn) caps these
numpy = ">=1.25,<2.4"
scipy = ">=1.5.4,<1.17"
scikit-learn = ">=1.4,<1.8"
# woodwork (featuretools -> fastdfs) still imports pkg_resources
setuptools = "<81"

[pypi-dependencies]
relbench = "==3.0.1"
fastdfs = "==1.1"
rdblearn = "==1.1"
duckdb = "*"
pyyaml = "*"
# foundation-model predictors: TabICLv2, and NVIDIA's Kumo Tabular (not on PyPI)
tabicl = "==2.2.0"
structured-data-models = { git = "https://github.com/NVIDIA/structured-data-models.git", rev = "89c990710cbb61984b1c0bd9ca0259c6f4efe93f" }

[feature.dev.dependencies]
pytest = "*"
ruff = "==0.16.8"  # same version as .pre-commit-config.yaml
pre-commit = "*"

[environments]
default = { features = ["dev"], solve-group = "default" }

[activation.env]
PYTHONHASHSEED = "0"  # config.SEED; TabICL's predictions depend on Python's set order

[tasks]
taskgen = "python -m taskgen"
test = "pytest -q tests"
fmt = "ruff check --fix . && ruff format ."

[pypi-options.dependency-overrides]
# rdblearn pins relbench==2.1.2, but only its unused from_relbench helper imports it
relbench = "==3.0.1"
